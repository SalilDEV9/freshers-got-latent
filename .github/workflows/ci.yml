name: Verify Freshers Got Latent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fgl_test
          POSTGRES_USER: fgl_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fgl_test -d fgl_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fgl_test:disposable-ci-only@localhost:5432/fgl_test
      FGL_ALLOW_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
  browser:
    runs-on: ubuntu-latest
    env:
      FGL_E2E_PASSWORD: disposable-browser-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: frontend/playwright-report/
  nextjs-entry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fgl_entry_test
          POSTGRES_USER: fgl_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fgl_test -d fgl_entry_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: node tests/http-smoke.mjs
        working-directory: web
      - run: node tests/postgres-race.mjs
        working-directory: web
        env:
          FGL_TEST_DATABASE_URL: postgres://fgl_test:disposable-ci-only@localhost:5432/fgl_entry_test
          FGL_ALLOW_TEST_DATABASE: '1'
